services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - bolalar-data:/data
    restart: unless-stopped

volumes:
  bolalar-data:
